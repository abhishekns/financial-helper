[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-helper"
version = "0.1.0"
description = "Starter scaffold for an agentic financial reminder system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
financial-helper-ui = "financial_helper.ui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
