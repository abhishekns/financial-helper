name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest

      - name: Run tests before package release build
        run: pytest -q

      - name: Build package artifacts
        run: python -m build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-package-artifacts
          path: dist/*

  build-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install desktop build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest

      - name: Run tests before desktop release build
        run: pytest -q

      - name: Build desktop application
        run: pyinstaller --noconfirm --onefile --name financial-helper --paths src src/financial_helper/__main__.py

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-artifacts
          path: dist/financial-helper*

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-package
      - build-application
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-package-artifacts
          path: release-assets/package

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-desktop-artifacts
          path: release-assets/application

      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/package/*
            release-assets/application/*
